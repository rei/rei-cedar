name: Unit

on:
  pull_request:
    branches:
      - next
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm run format:check
      - name: Check token contract types
        run: pnpm run check:tokens
      - name: Run token contract tests
        run: pnpm run test:tokens
      - name: Check generated component tokens
        run: pnpm run check:maps
      - run: pnpm run build --if-present
      - name: Check generated icons are committed
        run: git diff --exit-code src/components/icon
      - run: pnpm run lint
      - run: pnpm run unit
      - run: pnpm run build-storybook
      - run: pnpm run validate-storybook
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm run test:playwright
